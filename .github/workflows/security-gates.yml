name: Security gates

on:
  pull_request:
    paths:
      - "src/file_workflow.py"
      - "tests/test_file_workflow.py"
      - "docs/**"
      - "services/**"
      - ".github/workflows/security-gates.yml"

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run file-pipeline tests
        run: python3 -m unittest tests/test_file_workflow.py
