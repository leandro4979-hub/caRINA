name: Pipeline specification sync

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  specification-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require pipeline specification updates
        run: sh scripts/verify-spec-sync.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
